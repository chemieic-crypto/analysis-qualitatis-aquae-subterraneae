        const guessMapping = (expected, available) => {
            const clean = str => String(str).toLowerCase().replace(/[^a-z0-9]/g, '');
            const eClean = clean(expected);
            
            // 1. Exact clean match
            const exact = available.find(a => clean(a) === eClean);
            if (exact) return exact;
            
            // 2. Contains or is contained by (safe check for longer strings)
            const partial = available.find(a => {
                const aClean = clean(a);
                return aClean.length > 3 && eClean.length > 3 && (aClean.includes(eClean) || eClean.includes(aClean));
            });
            if (partial) return partial;
            
            return "";

                    // Create multiple base map layers
                    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

                    });

                    const topoLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {

                    });

                    const lightCanvasLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                        subdomains: 'abcd',
                        maxZoom: 20
                    });

                    // Add default layer
                    osmLayer.addTo(mapRef.current);

                    // Setup layer control
                    const baseMaps = {
                        "OpenStreetMap": osmLayer,
                        "Satellite (Esri)": satelliteLayer,
                        "Topographic": topoLayer,
                        "Light Canvas": lightCanvasLayer
                    };

                    L.control.layers(baseMaps, null, { position: 'topright' }).addTo(mapRef.current);
                    
                    // Add geojson layer FIRST so it sits behind the data markers
                    geoJsonLayerRef.current.addTo(mapRef.current);
                    markersLayer.current.addTo(mapRef.current);

                // Clear old markers
                markersLayer.current.clearLayers();

                if (data.length > 0) {

                    data.forEach(row => {
                        const lat = parseFloat(row.Latitude);
                        const lng = parseFloat(row.Longitude);
                        if (isNaN(lat) || isNaN(lng)) return;

                        let overallStatus = 'safe';
                        let paramsHtml = '';
                        let contaminatedParamsCount = 0; // Track contamination count

                        // Evaluate each parameter for this specific row
                        Object.keys(limits).forEach(param => {
                            if (row[param] !== undefined && row[param] !== null && row[param] !== '') {
                                const val = parseFloat(row[param]);
                                let paramStatus = 'safe';
                                let paramColor = '#10b981'; // Green
                                
                                if (!isNaN(val)) {
                                    const limit = limits[param];
                                    if (limit.isStrictRange) {
                                        if (val < limit.acc || val > limit.perm) { 
                                            paramStatus = 'unsafe'; 
                                            paramColor = '#ef4444'; // Red
                                            overallStatus = 'unsafe';
                                        }
                                    } else {
                                        if (val > limit.perm) { 
                                            paramStatus = 'unsafe'; 
                                            paramColor = '#ef4444'; // Red
                                            overallStatus = 'unsafe';
                                        } else if (val > limit.acc) { 
                                            paramStatus = 'marginal'; 
                                            paramColor = '#f97316'; // Orange
                                            if (overallStatus !== 'unsafe') overallStatus = 'marginal';
                                        }
                                    }

                                    // Count parameters that are outside safe limits
                                    if (paramStatus !== 'safe') {
                                        contaminatedParamsCount++;

                const sSummary = {};

                // Cache limits array outside the loop for massive performance boost
                const limitEntries = Object.entries(limits);

                for (let i = 0; i < rawData.length; i++) {

                    const district = row["District"];
                    
                    if (!state) continue;
                    
                    if (!sSummary[state]) {
                        sSummary[state] = { state, total: 0, safe: 0, marginal: 0, unsafe: 0, marginalParams: new Set(), unsafeParams: new Set() };
                    }
                    sSummary[state].total++;

                    let dKey = null;
                    if (district) {
                        dKey = `${state}-${district}`;
                        if (!dSummary[dKey]) {
                            dSummary[dKey] = { state, district, total: 0, safe: 0, marginal: 0, unsafe: 0, marginalParams: new Set(), unsafeParams: new Set() };
                        }
                        dSummary[dKey].total++;
                    }

                    let rowIsUnsafe = false;
                    let rowIsMarginal = false;

                    for (let j = 0; j < limitEntries.length; j++) {
                        const [param, limit] = limitEntries[j];
                        const valStr = row[param];
                        
                        if (valStr == null || valStr === '') continue;
                        
                        const val = parseFloat(valStr);
                        if (val !== val) continue; // Fast isNaN check

                        const shortName = param.split(' ')[0];

                        if (limit.isStrictRange) {
                            if (val < limit.acc || val > limit.perm) {
                                rowIsUnsafe = true;
                                sSummary[state].unsafeParams.add(shortName);
                                if (dKey) dSummary[dKey].unsafeParams.add(shortName);
                            }
                        } else {
                            if (val > limit.perm) {
                                rowIsUnsafe = true;
                                sSummary[state].unsafeParams.add(shortName);
                                if (dKey) dSummary[dKey].unsafeParams.add(shortName);
                            } else if (val > limit.acc) {
                                rowIsMarginal = true;
                                sSummary[state].marginalParams.add(shortName);
                                if (dKey) dSummary[dKey].marginalParams.add(shortName);
                            }
                        }
                    }

                    if (rowIsUnsafe) {
                        sSummary[state].unsafe++;
                        if (dKey) dSummary[dKey].unsafe++;
                    } else if (rowIsMarginal) {
                        sSummary[state].marginal++;
                        if (dKey) dSummary[dKey].marginal++;
                    } else {
                        sSummary[state].safe++;
                        if (dKey) dSummary[dKey].safe++;
                    }
                }

                const formatSummary = (summaryObj, sortFn) => Object.values(summaryObj).map(s => {
                    const combined = new Set([...s.unsafeParams, ...s.marginalParams]);
                    let hasHeavyMetals = false;
                    for (const p of combined) {
                        if (HEAVY_METALS.includes(p)) {
                            hasHeavyMetals = true;
                            break;
                        }
                    }
                    return {
                        ...s,
                        key: s.district ? `${s.state}-${s.district}` : s.state,
                        combinedCount: combined.size,
                        hasHeavyMetals,
                        unsafeList: Array.from(s.unsafeParams).sort(),
                        marginalList: Array.from(s.marginalParams).filter(p => !s.unsafeParams.has(p)).sort()
                    };
                }).sort(sortFn);

                return {
                    summaryData: formatSummary(sSummary, (a, b) => a.state.localeCompare(b.state)),
                    districtSummaryData: formatSummary(dSummary, (a, b) => a.state.localeCompare(b.state) || a.district.localeCompare(b.district))
                };
            }, [rawData, limits]);

            const isSingleState = summaryData.length === 1;
            const reportLocation = isSingleState ? summaryData[0].state : 'All India';
            const reportTableData = isSingleState ? districtSummaryData : summaryData;

            // Dynamically determine which parameters are contaminated across the dataset
            const activeContaminatedParams = useMemo(() => {
                const params = new Set();
                reportTableData.forEach(row => {
                    row.unsafeList.forEach(p => params.add(p));
                    row.marginalList.forEach(p => params.add(p));
                });
                return Array.from(params);
            }, [reportTableData]);

            // Filter out remedial measures based on actual contaminations
            const activeRemedialMeasures = REMEDIAL_MEASURES.filter(m => activeContaminatedParams.includes(m.id));

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        // Parse preserving empty cells so header row is correctly detected even if sparse
                        const data = XLSX.utils.sheet_to_json(ws, { defval: "" });
                        
                        if (data.length === 0) {
                            setUploadError("The uploaded file appears to be empty.");
                            return;
                        }

                        // Extract headers from the first object
                        const headers = Object.keys(data[0]);
                        setUploadedColumns(headers);

                        // Guess initial mapping
                        const initialMapping = {};
                        COLUMNS.forEach(col => {
                            initialMapping[col] = guessMapping(col, headers);
                        });
                        
                        setColumnMapping(initialMapping);
                        setUploadingFile(data);
                        setShowMappingModal(true);
                    } catch (err) {
                        console.error("Error parsing file", err);
                        setUploadError("Could not read file. Ensure it is a valid Excel or CSV.");
                    }
                };
                reader.readAsBinaryString(file);
                e.target.value = null; // reset input
            };

            const applyMapping = () => {
                const mappedData = uploadingFile.map(row => {
                    const newRow = {};
                    COLUMNS.forEach(col => {
                        const mappedKey = columnMapping[col];
                        if (mappedKey && row[mappedKey] !== undefined && row[mappedKey] !== "") {
                            newRow[col] = row[mappedKey];
                        } else {
                            newRow[col] = "";
                        }
                    });
                    return newRow;
                });
                
                setRawData(mappedData);
                setShowMappingModal(false);
                setUploadingFile(null);
            };

            const handleShapefileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                setUploadError('');
                
                try {
                    const buffer = await file.arrayBuffer();
                    const geojson = await shp(buffer);
                    setGeoJsonData(geojson);
                    // Automatically switch to map tab to show the uploaded shapefile
                    setActiveTab('map');
                } catch (error) {
                    console.error("Error parsing shapefile:", error);
                    setUploadError("Could not parse the ZIP file. Please ensure it contains valid .shp, .shx, and .dbf files.");
                    setTimeout(() => setUploadError(''), 5000); // Clear error after 5 seconds
                }
                
                // Reset file input
                e.target.value = null;
            };

            const downloadTemplate = () => {
                const ws = XLSX.utils.aoa_to_sheet([COLUMNS]);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Water Quality Data");
                XLSX.writeFile(wb, "Water_Quality_Template.xlsx");

                        "Unsafe Locations": row.unsafe,
                        "Unsafe Parameters": row.unsafeList.join(', '),
                        "Marginal Parameters": row.marginalList.join(', '),

                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "State Summary");
                    XLSX.writeFile(wb, "State_Quality_Summary.xlsx");

                const htmlContent = `

                        </style>
                    </head>
                    <body>
                        <div class="WordSection1">
                            ${clone.innerHTML}
                        </div>
                    </body>
                    </html>
                `;

                // Add BOM (\ufeff) to ensure Word parses it as UTF-8
                const blob = new Blob(['\ufeff', htmlContent], {
                    type: 'application/msword'
                });
                
                const url = URL.createObjectURL(blob);

                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

                setTimeout(() => {

            };

            const getIssuingOffice = () => {

                const normalizedMatch = Object.keys(CGWB_LABS).find(k => k.toLowerCase() === stateName.toLowerCase());
                if (normalizedMatch) {
                    // Replaces the comma in "Region, City" with a hyphen -> "Region-City"
                    return `CGWB, ${CGWB_LABS[normalizedMatch].replace(', ', '-')}`;
                }
                return `CGWB, Regional Office-${stateName}`;
            };

            return (
                <div className="min-h-screen pb-12">
                    <div className="bg-slate-900 text-white py-3 px-6 shadow-md border-b-4 border-slate-800">
                        <div className="w-full flex flex-col md:flex-row justify-between items-center">
                            <div>
                                <h1 className="text-xl md:text-2xl font-bold flex items-center gap-2 drop-shadow-md">
                                    <svg className="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
                                    Fortnightly GW Quality Alerts Validation Interface
                                </h1>
                            </div>
                            <div className="mt-3 md:mt-0 flex flex-wrap gap-3">
                                <button onClick={downloadTemplate} className="px-4 py-2 rounded-xl font-bold text-white bg-gradient-to-b from-emerald-400 to-emerald-600 border border-emerald-700 shadow-[0_4px_0_rgb(4,120,87)] hover:from-emerald-300 hover:to-emerald-500 active:shadow-[0_0px_0_rgb(4,120,87)] active:translate-y-[4px] transition-all flex items-center gap-2 text-sm">
                                    Download Template
                                </button>
                                <label className="px-4 py-2 rounded-xl font-bold text-white bg-gradient-to-b from-blue-400 to-blue-600 border border-blue-700 shadow-[0_4px_0_rgb(29,78,216)] hover:from-blue-300 hover:to-blue-500 active:shadow-[0_0px_0_rgb(29,78,216)] active:translate-y-[4px] transition-all cursor-pointer flex items-center gap-2 text-sm">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" /></svg>
                                    Shapefile (ZIP)
                                    <input type="file" accept=".zip" className="hidden" onChange={handleShapefileUpload} />
                                </label>
                                <label className="px-4 py-2 rounded-xl font-bold text-slate-800 bg-gradient-to-b from-white to-gray-200 border border-gray-300 shadow-[0_4px_0_rgb(156,163,175)] hover:from-gray-50 hover:to-gray-100 active:shadow-[0_0px_0_rgb(156,163,175)] active:translate-y-[4px] transition-all cursor-pointer flex items-center gap-2 text-sm">

                    </div>

                    {uploadError && (
                        <div className="w-full px-6 mt-4">

                                </button>

                            >

                            <button

                            >

                            >
                                Standards & Remedial Measures
                            </button>
                            <button

                            >
                                Standard Treatments
                            </button>
                        </div>

                        {activeTab === 'report' && (
                            <div className="bg-white rounded-xl shadow-lg border border-gray-300 overflow-hidden mb-8 print-container">
                                <div className="bg-gray-50 px-8 py-5 border-b border-gray-200 flex justify-between items-center no-print">

                                    <div className="flex gap-4">
                                        <button onClick={handleDownloadWord} className="px-5 py-2.5 rounded-xl font-bold text-white bg-gradient-to-b from-indigo-500 to-indigo-700 border border-indigo-800 shadow-[0_5px_0_rgb(49,46,129)] hover:from-indigo-400 hover:to-indigo-600 active:shadow-none active:translate-y-[5px] transition-all flex items-center gap-2">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                                            Download Word
                                        </button>
                                        <button onClick={handlePrint} className="px-5 py-2.5 rounded-xl font-bold text-white bg-gradient-to-b from-sky-500 to-sky-700 border border-sky-800 shadow-[0_5px_0_rgb(7,89,133)] hover:from-sky-400 hover:to-sky-600 active:shadow-none active:translate-y-[5px] transition-all flex items-center gap-2">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>

                                <div className="p-8 md:p-12 text-gray-800 text-justify leading-relaxed text-[15px] max-w-5xl mx-auto">

                                    <table className="w-full border-collapse border border-black mb-8 text-[15px]">

                                                        <div className="flex items-center gap-2">
                                                            <span className="w-10 text-sm font-semibold text-gray-600">From</span>

                                                                <div className="px-2 py-1 border border-gray-300 rounded text-sm bg-white text-center font-bold cursor-pointer hover:bg-gray-50 transition">
                                                                    {fromDate.split('-').reverse().join('/')}

                                                            <div className="relative flex-1 max-w-[120px]">
                                                                <div className="px-2 py-1 border border-gray-300 rounded text-sm bg-white text-center font-bold cursor-pointer hover:bg-gray-50 transition">
                                                                    {toDate.split('-').reverse().join('/')}
                                                                </div>
                                                                <input type="date" value={toDate} onChange={e => setToDate(e.target.value)} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" title="Select To Date" />
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="print-only hidden font-semibold">
                                                        <div>From: {fromDate.split('-').reverse().join('/')}</div>
                                                        <div>To: {toDate.split('-').reverse().join('/')}</div>
                                                    </div>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td className="border border-black p-2 font-bold bg-gray-100">Issue Date</td>
                                                <td className="border border-black p-2 align-top">
                                                    <div className="no-print relative max-w-[120px]">
                                                        <div className="px-2 py-1 border border-gray-300 rounded text-sm bg-white text-center font-bold cursor-pointer hover:bg-gray-50 transition">
                                                            {issueDate.split('-').reverse().join('/')}
                                                        </div>
                                                        <input type="date" value={issueDate} onChange={e => setIssueDate(e.target.value)} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" title="Select Issue Date" />
                                                    </div>
                                                    <div className="print-only hidden font-semibold">
                                                        {issueDate.split('-').reverse().join('/')}
                                                    </div>
                                                </td>
                                                <td className="border border-black p-2 font-bold bg-gray-100">Issuing Office</td>
                                                <td className="border border-black p-2">{getIssuingOffice()}</td>
                                            </tr>
                                        </tbody>
                                    </table>

                                    {/* Dynamic Calculations for the Introduction */}
                                    {(() => {
                                        // Uses the exact same array.reduce computation as the Sum Row in the table
                                        const overallTotal = reportTableData.reduce((sum, row) => {
                                            const man = manualTotals[row.key];
                                            const val = (man !== undefined && man !== '') ? (parseInt(man, 10) || 0) : row.total;
                                            return sum + (isNaN(val) ? 0 : val);
                                        }, 0);

                                        const overallMarginal = reportTableData.reduce((acc, curr) => acc + curr.marginal, 0);
                                        const overallUnsafe = reportTableData.reduce((acc, curr) => acc + curr.unsafe, 0);
                                        const overallContaminated = overallMarginal + overallUnsafe;
                                        
                                        const statesWithHM = Array.from(new Set(reportTableData.filter(s => s.hasHeavyMetals).map(s => s.state)));
                                        
                                        const formatList = (list) => {
                                            if (list.length === 0) return '';
                                            if (list.length === 1) return list[0];
                                            if (list.length === 2) return list.join(' and ');
                                            return list.slice(0, -1).join(', ') + ', and ' + list[list.length - 1];
                                        };
                                        
                                        let hmStateText = statesWithHM.length > 0 ? `Additionally, specific testing for Heavy Metals was performed on samples from ${formatList(statesWithHM)}.` : '';

                                        // Determine lab text dynamically based on whether it's a single state
                                        const getLabText = () => {
                                            if (!isSingleState) return "across various states in CGWB Regional Chemical Laboratories";
                                            
                                            // Normalize state string for matching
                                            const stateName = reportLocation.trim();
                                            const normalizedMatch = Object.keys(CGWB_LABS).find(k => k.toLowerCase() === stateName.toLowerCase());
                                            
                                            if (normalizedMatch) {
                                                return `in CGWB Regional Chemical Laboratory, ${CGWB_LABS[normalizedMatch]}`;
                                            }
                                            return `in the CGWB Regional Chemical Laboratory for ${stateName}`;
                                        };

                                        return (
                                            <div className="mb-8">
                                                <h3 className="font-bold text-lg mb-3">Groundwater Quality Analysis Report Summary</h3>
                                                <p className="mb-3">
                                                    A comprehensive analysis of <b>{overallTotal}</b> groundwater samples was conducted {getLabText()} to assess water quality as per the BIS Drinking Water Standard (IS 10500:2012).
                                                </p>
                                                <p className="mb-6">
                                                    Analysed parameters included pH, Electrical Conductivity, Total Hardness, Calcium, Magnesium, Sodium, Potassium, Carbonate, Bicarbonate, Sulphate, Chloride, Nitrate, Fluoride and Trace/Heavy Metals such as Arsenic, Uranium and Iron. {hmStateText}
                                                </p>

                                                <h4 className="font-bold mb-2">Key Findings</h4>
                                                <p className="mb-2">
                                                    Out of the <b>{overallTotal}</b> total samples analyzed, <b>{overallContaminated}</b> were found to be contaminated. These results are categorized as follows:
                                                </p>
                                                <ul className="list-disc pl-8 mb-6 space-y-1">
                                                    <li>Exceeding Acceptable Limit (but up to permissible limit): <b>{overallMarginal}</b> samples</li>
                                                    <li>Exceeding Permissible Limit: <b>{overallUnsafe}</b> samples</li>
                                                </ul>

                                                <p className="mb-4">
                                                    The following table provides a breakdown of contaminant detection by {isSingleState ? 'District' : 'State/Union Territory'}. Please refer to the attached Excel sheet for the comprehensive, parameter-wise analytical data.
                                                </p>
                                            </div>
                                        );
                                    })()}
                                    
                                    <h3 className="font-bold underline mb-4">Para I</h3>
                                    
                                    <SimpleReportTable data={reportTableData} isDistrict={isSingleState} manualTotals={manualTotals} onManualTotalChange={handleManualTotalChange} />

                                    <div className="page-break-before pt-8">
                                        <h3 className="font-bold underline mb-4">Para II</h3>
                                        
                                        {activeRemedialMeasures.length > 0 ? (
                                            <>
                                                <p className="mb-6">The anomalies may be termed major in some case.</p>

                                                <h4 className="font-bold text-lg underline mb-4">Risk Perception and Remedial Measures</h4>
                                                
                                                <div className="space-y-6">
                                                    {activeRemedialMeasures.map((measure, idx) => (
                                                        <div key={measure.id} className="avoid-break mb-4">
                                                            <h5 className="font-bold underline mb-2 text-[16px]">{measure.title}</h5>
                                                            
                                                            {measure.riskPerception && (
                                                                <div className="mb-2">
                                                                    <span className="font-bold mr-1">Risk Perception:</span>
                                                                    <span>{measure.riskPerception}</span>
                                                                </div>
                                                            )}
                                                            
                                                            <div className="mb-2">
                                                                <span className="font-bold block mb-1">Remedial Measures:</span>
                                                                {measure.desc && <p className="mb-1">{measure.desc}</p>}
                                                                {measure.sections.map((sec, sIdx) => (
                                                                    <div key={sIdx} className="mb-1">
                                                                        {sec.subtitle && <p className="font-bold inline mr-1">{sec.subtitle}</p>}
                                                                        {sec.desc && <p className="inline">{sec.desc}</p>}
                                                                        
                                                                        {sec.points && (
                                                                            <ul className="list-disc pl-8 mt-1 space-y-1">
                                                                                {sec.points.map((pt, pIdx) => (
                                                                                    <li key={pIdx}>{pt}</li>
                                                                                ))}
                                                                            </ul>
                                                                        )}
                                                                        
                                                                        {sec.postDesc && <p className="mt-1">{sec.postDesc}</p>}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </>
                                        ) : (
                                            <p className="italic text-gray-600 mb-6">
                                                All tested parameters in the provided dataset are within safe limits. No specific remedial measures are currently required.
                                            </p>
                                        )}
                                    </div>

                                </div>
                            </div>
                        )}

                        {activeTab === 'state' && (
                            <div className="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden mb-8">
                                <div className="bg-gray-50 px-6 py-4 border-b border-gray-200 flex justify-between items-center flex-wrap gap-4">
                                    <h2 className="text-xl font-bold text-gray-800">State/Union Territory-wise Groundwater Contamination</h2>
                                    <div className="flex items-center gap-6">
                                        <div className="flex gap-4 text-xs">
                                            <span className="flex items-center gap-1"><div className="w-3 h-3 bg-emerald-500 rounded"></div> Safe</span>
                                            <span className="flex items-center gap-1"><div className="w-3 h-3 bg-orange-500 rounded"></div> Marginal</span>
                                            <span className="flex items-center gap-1"><div className="w-3 h-3 bg-red-500 rounded"></div> Unsafe</span>
                                        </div>
                                        {summaryData.length > 0 && (
                                            <button 
                                                onClick={exportSummary}
                                                className="px-4 py-2 rounded-lg font-bold text-white bg-gradient-to-b from-amber-500 to-amber-700 border border-amber-800 shadow-[0_4px_0_rgb(146,64,14)] hover:from-amber-400 hover:to-amber-600 active:shadow-none active:translate-y-[4px] transition-all flex items-center gap-1.5 text-xs"
                                            >
                                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                                                Export Table
                                            </button>
                                        )}
                                    </div>
                                </div>
                                
                                <SummaryTable data={summaryData} isDistrict={false} manualTotals={manualTotals} onManualTotalChange={handleManualTotalChange} />
                            </div>
                        )}

                        {activeTab === 'district' && (
                            <div className="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden mb-8">
                                <div className="bg-gray-50 px-6 py-4 border-b border-gray-200 flex justify-between items-center flex-wrap gap-4">
                                    <h2 className="text-xl font-bold text-gray-800">District-wise Summary</h2>
                                    <div className="flex items-center gap-6">
                                        <div className="flex gap-4 text-xs">
                                            <span className="flex items-center gap-1"><div className="w-3 h-3 bg-emerald-500 rounded"></div> Safe</span>
                                            <span className="flex items-center gap-1"><div className="w-3 h-3 bg-orange-500 rounded"></div> Marginal</span>
                                            <span className="flex items-center gap-1"><div className="w-3 h-3 bg-red-500 rounded"></div> Unsafe</span>
                                        </div>
                                        {districtSummaryData.length > 0 && (
                                            <button 
                                                onClick={exportSummary}
                                                className="px-4 py-2 rounded-lg font-bold text-white bg-gradient-to-b from-amber-500 to-amber-700 border border-amber-800 shadow-[0_4px_0_rgb(146,64,14)] hover:from-amber-400 hover:to-amber-600 active:shadow-none active:translate-y-[4px] transition-all flex items-center gap-1.5 text-xs"
                                            >
                                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                                                Export Table
                                            </button>
                                        )}
                                    </div>
                                </div>
                                
                                <SummaryTable data={districtSummaryData} isDistrict={true} manualTotals={manualTotals} onManualTotalChange={handleManualTotalChange} />
                            </div>
                        )}

                        {activeTab === 'map' && (
                            <div className="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden p-4 mb-8">
                                <MapContainer data={rawData} limits={limits} geoJsonData={geoJsonData} />
                                <div className="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div className="bg-emerald-50 p-3 rounded-lg border border-emerald-100 flex items-center gap-3">
                                        <div className="w-4 h-4 rounded-full bg-emerald-500"></div>
                                        <span className="text-sm font-bold text-emerald-800">Safe: All parameters within acceptable limits</span>
                                    </div>
                                    <div className="bg-orange-50 p-3 rounded-lg border border-orange-200 flex items-center gap-3">
                                        <div className="w-4 h-4 rounded-full bg-orange-500"></div>
                                        <span className="text-sm font-bold text-orange-800">Marginal: Above Acceptable, below Permissible</span>
                                    </div>
                                    <div className="bg-red-50 p-3 rounded-lg border border-red-100 flex items-center gap-3">
                                        <div className="w-4 h-4 rounded-full bg-red-500"></div>
                                        <span className="text-sm font-bold text-red-800">Unsafe: Above Permissible (or pH out of range)</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'standards' && (
                            <div className="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden mb-8">
                                <div className="bg-gradient-to-r from-slate-800 to-slate-900 px-6 py-4 border-b border-gray-200 flex justify-between items-center shadow-inner">
                                    <div>
                                        <h2 className="text-lg font-black text-white drop-shadow-md">BIS 10500:2012 Standards, Risk Perceptions & Remedial Measures</h2>
                                        <p className="text-xs text-slate-300 mt-0.5 font-medium">Fixed acceptable and permissible limits with corresponding risk implications and remedial measure strategies.</p>
                                    </div>
                                </div>
                                <div className="overflow-x-auto p-3 bg-slate-100">
                                    <table className="w-full text-left border-separate min-w-[700px]" style={{ borderSpacing: '0 6px' }}>
                                        <thead>
                                            <tr className="text-slate-500 text-[10px] uppercase tracking-widest">
                                                <th className="px-3 pb-1 font-black w-32">Parameter</th>
                                                <th className="px-2 pb-1 font-black w-24 text-center">Acceptable Limit</th>
                                                <th className="px-2 pb-1 font-black w-24 text-center">Permissible Limit</th>
                                                <th className="px-3 pb-1 font-black">Information & Strategy</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {Object.keys(limits).map((param, index) => {
                                                const limit = limits[param];
                                                const shortName = param.split(' ')[0];
                                                const measure = REMEDIAL_MEASURES.find(m => m.id === shortName);
                                                const color = PARAM_COLORS[index % PARAM_COLORS.length];
                                                
                                                return (
                                                    <tr key={param} className="bg-white hover:bg-slate-50 transition-colors group rounded-xl shadow-[0_2px_5px_rgba(0,0,0,0.03)] hover:shadow-[0_4px_10px_rgba(0,0,0,0.06)]">
                                                        <td className="p-2 rounded-l-xl border border-r-0 border-gray-100 align-middle">
                                                            <div className={`inline-flex flex-col min-w-[70px] bg-gradient-to-b ${color.bg} text-white px-2 py-1.5 rounded-lg ${color.shadow} border ${color.border} transform group-hover:-translate-y-0.5 transition-transform`}>
                                                                <span className="font-black text-sm drop-shadow-md tracking-wide"><FormatParam param={shortName} /></span>
                                                                {param.includes('(') && <span className="text-[8px] font-bold text-white/80 mt-0.5 uppercase tracking-tighter leading-tight">{param.substring(param.indexOf('('))}</span>}
                                                            </div>
                                                        </td>
                                                        <td className="p-2 border-t border-b border-gray-100 text-center align-middle">
                                                            <div className="mx-auto min-w-[50px] w-max bg-gradient-to-b from-emerald-400 to-emerald-600 text-white px-2 py-1 rounded-lg shadow-[0_2px_0_rgb(4,120,87)] border border-emerald-700 font-black text-sm transform group-hover:-translate-y-0.5 transition-transform flex items-center justify-center">
                                                                {limit.acc}
                                                            </div>
                                                        </td>
                                                        <td className="p-2 border-t border-b border-gray-100 text-center align-middle">
                                                            <div className="mx-auto min-w-[50px] w-max bg-gradient-to-b from-rose-500 to-rose-700 text-white px-2 py-1 rounded-lg shadow-[0_2px_0_rgb(159,18,57)] border border-rose-800 font-black text-sm transform group-hover:-translate-y-0.5 transition-transform flex items-center justify-center">
                                                                {limit.perm}
                                                            </div>
                                                        </td>
                                                        <td className="p-2 rounded-r-xl border border-l-0 border-gray-100 align-middle">
                                                            <div className="bg-slate-50/80 border-l-2 border-slate-300 p-2 rounded-lg shadow-inner text-xs text-slate-700 font-medium leading-relaxed flex flex-col gap-2">
                                                                {measure ? (
                                                                    <>
                                                                        {measure.riskPerception && (
                                                                            <div>
                                                                                <span className="font-bold text-red-800">Risk Perception: </span>
                                                                                {measure.riskPerception}
                                                                            </div>
                                                                        )}
                                                                        <div>
                                                                            <span className="font-bold text-emerald-800">Remedial Measure: </span>
                                                                            {measure.sections.map((s, i) => <span key={i}>{s.desc} </span>)}
                                                                        </div>
                                                                    </>
                                                                ) : (
                                                                    <span className="text-gray-400 italic">Standard water treatment measures apply.</span>
                                                                )}
                                                            </div>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'treatments' && (
                            <div className="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden mb-8">
                                <div className="bg-gradient-to-r from-slate-800 to-slate-900 px-6 py-4 border-b border-gray-200 flex justify-between items-center shadow-inner">
                                    <div>
                                        <h2 className="text-lg font-black text-white drop-shadow-md">Standard Water Treatment Measures</h2>
                                        <p className="text-xs text-slate-300 mt-0.5 font-medium">Commonly applied water purification and treatment techniques for general water safety.</p>
                                    </div>
                                </div>
                                <div className="p-6 bg-slate-100/50 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
                                    {STANDARD_TREATMENTS.map((treatment, idx) => (
                                        <div key={treatment.title} className="bg-white rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.06)] border border-gray-100 overflow-hidden hover:shadow-[0_8px_16px_rgba(0,0,0,0.08)] hover:-translate-y-1 transition-all duration-300 group flex flex-col">
                                            <div className={`h-2.5 w-full bg-gradient-to-r ${treatment.color}`}></div>
                                            <div className="p-5 flex-1 flex flex-col">
                                                <h3 className={`text-base font-black mb-3 bg-clip-text text-transparent bg-gradient-to-r ${treatment.color}`}>
                                                    {treatment.title}
                                                </h3>
                                                <p className="text-xs text-slate-600 leading-relaxed font-medium mb-4">
                                                    {treatment.desc}
                                                </p>
                                                <div className="mt-auto bg-slate-50/80 border border-slate-100 p-3 rounded-lg shadow-inner">
                                                    <span className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1.5 block">Chemistry / Mechanism</span>
                                                    <p className="text-[10px] text-slate-700 font-mono leading-relaxed whitespace-pre-line">
                                                        {treatment.chemistry}
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Column Mapping Modal */}
                    {showMappingModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
                                <div className="p-6 bg-gradient-to-r from-blue-800 to-indigo-900 text-white flex justify-between items-center">
                                    <div>
                                        <h2 className="text-xl font-bold">Map Columns</h2>
                                        <p className="text-blue-200 text-sm mt-1">Please match your uploaded file's columns to the standard required format.</p>
                                    </div>
                                    <button onClick={() => setShowMappingModal(false)} className="text-white/70 hover:text-white transition-colors">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                                    </button>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto p-6 bg-slate-50 custom-scrollbar">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {COLUMNS.map(col => {
                                            const isParam = DEFAULT_LIMITS[col] !== undefined;
                                            return (
                                                <div key={col} className={`p-3 rounded-lg border ${columnMapping[col] ? 'bg-white border-emerald-200 shadow-sm' : 'bg-orange-50 border-orange-200 border-dashed'}`}>
                                                    <div className="flex flex-col gap-1.5">
                                                        <label className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                                                            {col}
                                                            {isParam && <span className="bg-blue-100 text-blue-800 text-[9px] px-1.5 py-0.5 rounded uppercase font-black tracking-wider">Param</span>}
                                                            {!columnMapping[col] && <span className="text-orange-600 text-[10px] font-bold italic ml-auto">Unmapped</span>}
                                                        </label>
                                                        <select
                                                            className="w-full text-sm p-2 border border-slate-300 rounded bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                                                            value={columnMapping[col] || ""}
                                                            onChange={(e) => setColumnMapping(prev => ({ ...prev, [col]: e.target.value }))}
                                                        >
                                                            <option value="">-- Ignore / Not present --</option>
                                                            {uploadedColumns.map(uploadedCol => (
                                                                <option key={uploadedCol} value={uploadedCol}>{uploadedCol}</option>
                                                            ))}
                                                        </select>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                                
                                <div className="p-4 border-t border-slate-200 bg-white flex justify-end gap-3">
                                    <button 
                                        onClick={() => setShowMappingModal(false)}
                                        className="px-5 py-2.5 rounded-xl font-bold text-slate-600 bg-slate-100 border border-slate-300 hover:bg-slate-200 transition-colors"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={applyMapping}
                                        className="px-5 py-2.5 rounded-xl font-bold text-white bg-gradient-to-b from-blue-500 to-blue-700 border border-blue-800 shadow-[0_3px_0_rgb(30,58,138)] hover:from-blue-400 hover:to-blue-600 active:shadow-none active:translate-y-[3px] transition-all flex items-center gap-2"
                                    >
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
                                        Import Data
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
